<!doctype html><html><head><meta charset="utf-8"><title>Dealer details</title><link rel="stylesheet" href="/static/style.css"></head><body><nav><a href="/static/index.html">Dealers</a><a href="/static/About.html">About Us</a><a href="/static/Contact.html">Contact Us</a></nav><main><h1>Dealer details and reviews</h1><div id="dealer" class="card">Loading dealer...</div><script>const id=new URLSearchParams(location.search).get('id')||1;fetch('/api/dealers/'+id).then(r=>r.json()).then(d=>document.querySelector('#dealer').innerHTML='<h2>'+d.full_name+'</h2><p>'+d.address+', '+d.city+', '+d.state+'</p><h3>Reviews</h3>'+(d.reviews||[]).map(r=>'<p>“'+r.review+'” ('+r.sentiment+')</p>').join('')||'<p>No reviews yet.</p>');</script></main></body></html>
